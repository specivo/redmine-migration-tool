name: Release

# Pushing a tag vX.Y.Z builds the wheel and sdist and attaches them to a
# GitHub Release for the tag. Nothing is published to PyPI.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - name: The tag matches the version in pyproject.toml
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          test "v${version}" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} != v${version}"; exit 1; }
      - run: uv build
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/*.whl
            dist/*.tar.gz
          generate_release_notes: true
          body: |
            Install:

            ```bash
            uv tool install git+https://github.com/specivo/redmine-migration-tool@${{ github.ref_name }}
            ```

            Bundle format v1. Loads into Specivo 0.11.0 or newer.
            Not affiliated with or endorsed by the Redmine project.
